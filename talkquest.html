<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TalkQuest 💬 — Practice tricky conversations</title>
<meta name="description" content="A free game for kids: practice handling tough, real-life conversations and choose your words wisely." />
<script src="./seeds.js"></script>
<style>
  :root{
    --paper:#EEF3F8; --ink:#1D2B4F; --inkSoft:#5A6B8C;
    --coral:#FF6B5E; --mint:#2FA97C; --amber:#E8A33D; --rose:#D95F76; --card:#FFFFFF;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink);
        font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,-apple-system,sans-serif; }

  #seeds-bar{ position:sticky; top:0; z-index:9999; display:flex; align-items:center;
        justify-content:space-between; padding:8px 14px; background:var(--paper); border-bottom:1px solid #D7E0EC; }
  #seeds-bar a, #seeds-bar .pill{ display:inline-flex; align-items:center; gap:7px; text-decoration:none;
        color:var(--ink); font-weight:700; font-size:15px; background:#E4EFE3; border:1px solid #CFE3D0;
        padding:6px 14px; border-radius:999px; }

  .wrap{ max-width:576px; margin:0 auto; padding:24px 16px 64px; display:flex; flex-direction:column; gap:16px; }

  .back{ align-self:flex-start; background:var(--card); color:var(--ink); border:1.5px solid var(--ink);
        border-radius:999px; padding:5px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }

  h1.logo{ display:inline-block; transform:rotate(1deg); background:var(--coral); color:#fff;
        border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); border-radius:16px;
        padding:8px 20px; font-size:31px; font-weight:800; letter-spacing:-0.02em; margin:0 0 12px; }
  h2{ font-size:21px; font-weight:800; margin:0; }

  .scen{ display:flex; align-items:center; gap:16px; width:100%; padding:16px; border-radius:16px;
        text-align:left; background:var(--card); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink);
        cursor:pointer; font-family:inherit; transition:transform .15s; }
  .scen:hover{ transform:translateY(-2px); }
  .scen .em{ font-size:29px; }
  .scen .t{ flex:1; }
  .scen .t b{ display:block; font-size:16px; font-weight:800; }
  .scen .t span{ display:block; font-size:14px; color:var(--inkSoft); }
  .scen .play{ background:var(--paper); border:1.5px solid var(--ink); border-radius:999px;
        padding:4px 12px; font-size:12px; font-weight:700; }

  .meter{ display:flex; align-items:center; gap:12px; background:var(--card);
        border:2px solid var(--ink); border-radius:16px; padding:12px 16px; }
  .meter .face{ display:flex; width:48px; height:48px; align-items:center; justify-content:center;
        border-radius:50%; font-size:24px; background:var(--paper); border:2px solid var(--ink); }
  .meter .bar{ height:12px; width:100%; overflow:hidden; border-radius:999px; margin-top:4px;
        background:var(--paper); border:1.5px solid var(--ink); }
  .meter .bar i{ display:block; height:100%; border-radius:999px; transition:width .5s; }
  .lbl{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--inkSoft); }

  .bub{ display:flex; align-items:flex-end; gap:8px; }
  .bub.you{ flex-direction:row-reverse; }
  .bub .av{ display:flex; width:40px; height:40px; flex-shrink:0; align-items:center; justify-content:center;
        border-radius:50%; font-size:20px; background:var(--card); border:2px solid var(--ink); }
  .bub .msg{ max-width:85%; border-radius:16px; padding:12px 16px; font-size:15px; line-height:1.4;
        background:var(--card); color:var(--ink); border:2px solid var(--ink); border-bottom-left-radius:4px; }
  .bub.you .msg{ background:var(--ink); color:#fff; border-bottom-left-radius:16px; border-bottom-right-radius:4px; }

  .choice{ width:100%; border-radius:16px; padding:13px 16px; text-align:left; font-size:15px;
        font-weight:600; line-height:1.4; background:var(--card); color:var(--ink);
        border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); cursor:pointer;
        font-family:inherit; transition:transform .12s; }
  .choice:hover{ transform:translateY(-2px); }

  .btn{ border-radius:14px; padding:12px 22px; font-size:15px; font-weight:800; cursor:pointer;
        font-family:inherit; border:2px solid var(--ink); }
  .btn.coral{ background:var(--coral); color:#fff; box-shadow:3px 3px 0 var(--ink); }
  .btn.plain{ background:var(--card); color:var(--ink); box-shadow:3px 3px 0 var(--ink); }
  .btn.dark{ background:var(--ink); color:#fff; box-shadow:3px 3px 0 var(--coral); align-self:flex-end; }
  .btn.wide{ width:100%; padding:14px; font-size:16px; }
  .btn:active{ transform:translateY(2px); }

  .card{ background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:18px; }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .center{ text-align:center; }
  .soft{ color:var(--inkSoft); }
  .tag{ border-radius:999px; padding:4px 12px; font-size:12px; font-weight:700; color:#fff;
        background:var(--mint); border:1.5px solid var(--ink); }

  @keyframes pop{ 0%{ transform:scale(.7); opacity:0; } 70%{ transform:scale(1.05); } 100%{ transform:scale(1); opacity:1; } }
  .pop{ animation:pop .34s ease-out both; }
  @media (prefers-reduced-motion: reduce){ .pop{ animation:none !important; } .scen:hover,.choice:hover{ transform:none; } }
</style>
</head>
<body>
  <div id="seeds-bar">
    <a href="index.html">🏡 Home</a>
    <span class="pill">🌱 <span id="seeds-num">0</span> seeds</span>
  </div>

  <div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  function awardSeeds(n, why){ try{ if(window.Seeds){ window.Seeds.award(n, why); toast(n); } }catch(e){} }
  function updateBar(){ var el=document.getElementById('seeds-num');
    if(el){ try{ el.textContent=(window.Seeds?window.Seeds.get():0); }catch(e){} } }
  function toast(n){
    var t=document.getElementById('seed-toast');
    if(!t){ t=document.createElement('div'); t.id='seed-toast';
      t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:#1D2B4F;color:#fff;font-family:inherit;font-weight:700;padding:13px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .4s cubic-bezier(.22,1,.36,1);z-index:10000;font-size:16px;";
      document.body.appendChild(t); }
    t.textContent="🌱 +"+n+" seeds!";
    requestAnimationFrame(function(){ t.style.transform="translateX(-50%) translateY(0)"; });
    clearTimeout(t._h); t._h=setTimeout(function(){ t.style.transform="translateX(-50%) translateY(120px)"; },2200);
    updateBar();
  }
  updateBar();
  if(window.Seeds && window.Seeds.onChange) window.Seeds.onChange(updateBar);

  // quality: 2 = great, 1 = okay, 0 = tricky
  var SCENARIOS=[
    { id:"grade", title:"The Math Test", adult:"Mom", emoji:"🧑‍🦱",
      setup:"You failed Friday's math test. The graded paper is in your backpack, and Mom just asked how school went.",
      goal:"Be honest before she finds out another way — and ask for help.",
      turns:[
        { npc:"Hey! How was school today? Anything happen?", choices:[
          { text:"Fine. Nothing really. (change the subject)", quality:0, delta:-8, skill:"Honesty first",
            feedback:"Hiding it buys a few quiet hours, but the test will surface eventually — and then the conversation is about the hiding, not the grade." },
          { text:"Mostly okay... math was rough, though.", quality:1, delta:5, skill:"Honesty first",
            feedback:"A soft opening! You cracked the door open, which makes the hard part easier to say next." },
          { text:"Actually, I need to tell you something. I failed the math test.", quality:2, delta:12, skill:"Honesty first",
            feedback:"Leading with the truth takes guts. Adults almost always respond better when the news comes from you, not from a surprise." }
        ] },
        { npc:"A fail? What happened? You said you studied.", choices:[
          { text:"The test was unfair! Everyone failed it.", quality:0, delta:-8, skill:"Taking responsibility",
            feedback:"Even if the test was hard, leading with blame makes it sound like an excuse — and invites an argument instead of help." },
          { text:"I did study, but I think I studied the wrong stuff.", quality:1, delta:6, skill:"Taking responsibility",
            feedback:"Honest and specific. Explaining what went wrong (without excuses) shows you've actually thought about it." },
          { text:"I studied, but not enough — I kept putting it off. That's on me.", quality:2, delta:12, skill:"Taking responsibility",
            feedback:"Owning your part is powerful. It tells her she doesn't have to lecture you — you already get it." }
        ] },
        { npc:"Okay. I appreciate you telling me. So what now?", choices:[
          { text:"I don't know. Can we just drop it?", quality:0, delta:-6, skill:"Asking for help",
            feedback:"Shutting the conversation down leaves the problem (and her worry) unsolved. A plan would end this on a high note." },
          { text:"I'll try harder next time, I promise.", quality:1, delta:5, skill:"Asking for help",
            feedback:"Good intent — but 'try harder' is vague. Adults relax when they hear a concrete plan." },
          { text:"Can the teacher or a tutor help me? And maybe you could quiz me before the retake?", quality:2, delta:12, skill:"Asking for help",
            feedback:"A real plan plus asking for help — that turns a bad grade into a team project. This is exactly how trust gets rebuilt." }
        ] }
      ] },
    { id:"extension", title:"Behind on the Project", adult:"Ms. Rivera", emoji:"👩‍🏫",
      setup:"Your science project is due Friday and you're way behind. It's Tuesday after class, and Ms. Rivera is at her desk.",
      goal:"Ask for help early — before the deadline becomes an emergency.",
      turns:[
        { npc:"Hi! Did you need something?", choices:[
          { text:"Uh... no, never mind. (walk out)", quality:0, delta:-6, skill:"Timing",
            feedback:"Walking away feels safer, but every day you wait, the problem grows and your options shrink. Asking early is a superpower." },
          { text:"Is the project really due Friday?", quality:1, delta:4, skill:"Timing",
            feedback:"You started the conversation — good! But hinting makes her guess. Saying the real situation gets you real help." },
          { text:"Yes — I'm behind on the project and I wanted to talk to you before Friday.", quality:2, delta:12, skill:"Timing",
            feedback:"Coming in early and saying it straight is exactly what teachers hope students will do. You just made her your ally." }
        ] },
        { npc:"Thanks for telling me now instead of Friday. How far along are you?", choices:[
          { text:"Pretty far. Almost done, basically. (not true)", quality:0, delta:-10, skill:"Honesty first",
            feedback:"A small fib here means her advice won't fit your real situation — and if it unravels, the trust you just earned goes with it." },
          { text:"I've done some research but haven't started building anything.", quality:1, delta:6, skill:"Honesty first",
            feedback:"Truthful and clear. Now she can actually help with the real problem." },
          { text:"Honestly? I've barely started. I picked a topic that's too complicated and got stuck.", quality:2, delta:12, skill:"Honesty first",
            feedback:"Full honesty plus naming why you got stuck. Teachers can fix 'stuck' — they can't fix what they don't know about." }
        ] },
        { npc:"Okay. What would help you most right now?", choices:[
          { text:"Can you just give me an A for effort?", quality:0, delta:-8, skill:"Asking, not demanding",
            feedback:"Asking her to erase the problem (instead of helping you solve it) puts her in an unfair spot." },
          { text:"Maybe... more time?", quality:1, delta:5, skill:"Asking, not demanding",
            feedback:"A reasonable ask! Pairing it with what YOU will do makes it even stronger." },
          { text:"Could I switch to a simpler topic and show you my progress Thursday? I can work on it tonight and tomorrow.", quality:2, delta:12, skill:"Asking, not demanding",
            feedback:"A specific request plus your own commitment — that's a proposal, not a rescue. Adults say yes to proposals." }
        ] }
      ] },
    { id:"coach", title:"Running on Empty", adult:"Coach D", emoji:"🧢",
      setup:"Between school, homework, and four practices a week, you're exhausted. You've decided to talk to Coach after practice.",
      goal:"Say how you really feel — respectfully — and find a workable change.",
      turns:[
        { npc:"Good hustle out there. You wanted to talk?", choices:[
          { text:"I quit. I'm done with this team.", quality:0, delta:-8, skill:"Staying calm",
            feedback:"Dropping a bomb closes the conversation before it starts. You can always quit later — but start by talking." },
          { text:"Practices have been feeling like... a lot lately.", quality:1, delta:5, skill:"Staying calm",
            feedback:"Honest, calm opener. Adding how it's affecting you would make it land even more clearly." },
          { text:"Yeah. I've been feeling really worn out — practices plus school is getting to be too much for me.", quality:2, delta:12, skill:"I-statements",
            feedback:"An 'I' statement — 'I've been feeling worn out' — describes your experience without blaming anyone. That keeps Coach listening instead of defending." }
        ] },
        { npc:"I hear you. The schedule is intense. Is it the sport, or everything together?", choices:[
          { text:"It's your practices. They're too hard and too long.", quality:0, delta:-7, skill:"I-statements",
            feedback:"'You' statements ('your practices are too hard') sound like an attack. The same idea as an 'I' statement — 'I'm struggling to recover between practices' — gets a totally different response." },
          { text:"Everything together, I think. I still like the sport.", quality:1, delta:6, skill:"I-statements",
            feedback:"Good — you separated the sport from the schedule. That gives Coach something to work with." },
          { text:"Everything together. I love playing, but I'm getting home at 7 and still have homework. I'm tired all the time.", quality:2, delta:12, skill:"I-statements",
            feedback:"Specific details about YOUR experience. Now Coach understands the real problem instead of guessing." }
        ] },
        { npc:"Thanks for being straight with me. What do you think would help?", choices:[
          { text:"I don't know. You're the coach, you figure it out.", quality:0, delta:-7, skill:"Asking, not demanding",
            feedback:"Coach offered you a seat at the table — pushing the whole problem back across it wastes the chance." },
          { text:"Maybe fewer practices for a while?", quality:1, delta:6, skill:"Asking, not demanding",
            feedback:"A real suggestion! Making it specific ('two practices a week this month') would make it easy to say yes to." },
          { text:"Could I drop to two practices a week until exams end? Then I'll see how I feel.", quality:2, delta:12, skill:"Asking, not demanding",
            feedback:"Specific, temporary, and reasonable — a request like this is almost impossible to refuse. And you kept the door open." }
        ] }
      ] },
    { id:"window", title:"The Backyard Ball", adult:"Mr. Okafor", emoji:"🧔",
      setup:"Your soccer ball just sailed over the fence and knocked over your neighbor's big ceramic planter. It's cracked. Nobody saw... yet.",
      goal:"Own up to the mistake before being asked — and make it right.",
      turns:[
        { npc:"(You knock. Mr. Okafor opens the door.) Oh, hello! What can I do for you?", choices:[
          { text:"Um... have you seen a soccer ball anywhere?", quality:0, delta:-6, skill:"Taking responsibility",
            feedback:"Fishing for the ball without mentioning the planter is a half-truth. He'll connect the dots — better if YOU connect them first." },
          { text:"Hi... I think my ball might have knocked something over in your yard.", quality:1, delta:6, skill:"Taking responsibility",
            feedback:"You brought it up — that's the hard part. 'Might have' softens it a bit much when you know it happened." },
          { text:"Hi Mr. Okafor. I kicked my ball over your fence and it broke your planter. I'm really sorry.", quality:2, delta:12, skill:"Taking responsibility",
            feedback:"Direct, honest, and first to say it. Owning a mistake before being confronted flips the whole mood — now you're the kid with integrity, not the kid who broke something." }
        ] },
        { npc:"Ah — that planter was a gift from my sister. That's disappointing.", choices:[
          { text:"It was an accident! It's not like I did it on purpose.", quality:0, delta:-7, skill:"Listening",
            feedback:"He didn't say you did it on purpose — he said he's disappointed. Defending yourself over feelings nobody attacked makes it worse." },
          { text:"I'm sorry. I didn't mean for it to happen.", quality:1, delta:6, skill:"Listening",
            feedback:"A sincere apology. Acknowledging what the planter meant to him would show you really heard him." },
          { text:"I'm really sorry — especially since it was from your sister. I should've been more careful playing that close to the fence.", quality:2, delta:12, skill:"Listening",
            feedback:"You repeated back what mattered to HIM. That's real listening, and it's what makes an apology feel genuine instead of automatic." }
        ] },
        { npc:"Well... I appreciate you coming over and telling me yourself.", choices:[
          { text:"Cool. Can I get my ball back now?", quality:0, delta:-8, skill:"Making it right",
            feedback:"Yikes — jumping straight to the ball makes the apology look like it was just the price of admission." },
          { text:"Again, I'm really sorry. I'll be more careful.", quality:1, delta:5, skill:"Making it right",
            feedback:"Kind and polite. Offering to actually fix the damage would complete the repair." },
          { text:"I'd like to make it right. I can pay for a new planter from my allowance, or help with yard work to cover it.", quality:2, delta:12, skill:"Making it right",
            feedback:"Apology + action = full repair. Offering to make it right (even in small ways) is what turns 'sorry' into something an adult never forgets." }
        ] }
      ] },
    { id:"curfew", title:"The Curfew Talk", adult:"Dad", emoji:"🧔🏽",
      setup:"Your friends can stay out until 9:30 on weekends. Your curfew is 8:00. You want to renegotiate — Dad is relaxed and reading on the couch.",
      goal:"Ask for more freedom like someone who can handle it.",
      turns:[
        { npc:"(Dad looks up from his book.) Hey kiddo. What's up?", choices:[
          { text:"My curfew is so unfair. Literally everyone stays out later than me.", quality:0, delta:-7, skill:"Staying calm",
            feedback:"Opening with 'unfair' and 'everyone' starts a debate, not a negotiation. Dads have a reflex response to 'everyone else does it.'" },
          { text:"Can we talk about my curfew sometime?", quality:1, delta:6, skill:"Timing",
            feedback:"Calm and respectful — and you picked a relaxed moment, which matters more than people think." },
          { text:"Hey Dad, is now a good time? I wanted to talk about maybe adjusting my weekend curfew.", quality:2, delta:12, skill:"Timing",
            feedback:"Asking 'is now a good time?' is a pro move. It shows respect and gets his full attention instead of half of it." }
        ] },
        { npc:"Alright, I'm listening. Why should it change?", choices:[
          { text:"Because 8:00 is for little kids. You're treating me like a baby.", quality:0, delta:-8, skill:"I-statements",
            feedback:"Accusations ('you're treating me like...') put him on defense. Your case is stronger when it's about what you've earned, not what he's doing wrong." },
          { text:"I feel like I've been pretty responsible lately and I'd like a chance to show it.", quality:1, delta:6, skill:"I-statements",
            feedback:"Good framing! Adding specific evidence would make it even more convincing." },
          { text:"I've kept my grades up, I always text where I am, and I've never missed curfew. I think I've earned a later one — maybe 9:30 on weekends.", quality:2, delta:12, skill:"Making your case",
            feedback:"Evidence plus a specific ask. You sound like someone who can handle more freedom — which is exactly the question he's weighing." }
        ] },
        { npc:"Hmm. I'll think about 9:00. Not 9:30 — not yet.", choices:[
          { text:"9:00?! That's barely anything. Forget it then.", quality:0, delta:-10, skill:"Staying calm",
            feedback:"He just moved an hour in your direction and got 'forget it' back. Storming off can undo a win that was already on the table." },
          { text:"Okay... I guess 9:00 is better than 8:00.", quality:1, delta:6, skill:"Staying calm",
            feedback:"You took the win, even if grudgingly. A little grace here sets up the NEXT negotiation." },
          { text:"Deal — 9:00 it is. And if I handle it well for a month, can we revisit 9:30?", quality:2, delta:12, skill:"Making your case",
            feedback:"Accepting the compromise AND scheduling round two — that's expert-level negotiation. He'll remember how maturely you handled this." }
        ] }
      ] }
  ];

  var QS={ 2:{tag:"Great move",color:"var(--mint)",icon:"★"},
           1:{tag:"Not bad",color:"var(--amber)",icon:"◐"},
           0:{tag:"Tricky path",color:"var(--rose)",icon:"↺"} };

  function shuffle(a){ a=a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a; }
  function mood(t){
    if(t>=75) return {face:"😊",label:"Connected"};
    if(t>=55) return {face:"🙂",label:"Open"};
    if(t>=40) return {face:"😐",label:"Listening"};
    if(t>=25) return {face:"😕",label:"Tense"};
    return {face:"😞",label:"Hurt"};
  }
  function rating(t,g){
    if(t>=80 && g>=2) return { stars:3, title:"Conversation Champion",
      note:"You said the hard thing, said it well, and left the relationship stronger than you found it." };
    if(t>=60) return { stars:2, title:"Solid Talker",
      note:"You got through it honestly. A few choices could land softer — replay and try the other paths!" };
    return { stars:1, title:"Brave Beginner",
      note:"Hard talks take practice — and you showed up, which is step one. Try again and watch the meter climb." };
  }
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var st={ screen:"home", sid:null, ti:0, trust:50, picked:null, history:[], greats:0, skills:[], best:{}, turns:[] };
  var app=document.getElementById('app');
  function scen(){ return SCENARIOS.filter(function(s){ return s.id===st.sid; })[0]; }

  function meter(adult,trust){
    var m=mood(trust), col = trust>=55?'var(--mint)':(trust>=40?'var(--amber)':'var(--rose)');
    return '<div class="meter"><div class="face" aria-hidden="true">'+m.face+'</div><div style="flex:1">'+
      '<div style="display:flex;align-items:baseline;justify-content:space-between">'+
        '<span class="lbl">'+esc(adult)+' feels</span>'+
        '<span style="font-size:14px;font-weight:800;color:'+col+'">'+m.label+'</span>'+
      '</div>'+
      '<div class="bar" role="meter" aria-valuenow="'+trust+'" aria-valuemin="0" aria-valuemax="100" aria-label="Trust meter">'+
        '<i style="width:'+trust+'%;background:'+col+'"></i></div>'+
    '</div></div>';
  }
  function bub(who,emoji,text){
    return '<div class="bub '+(who==='you'?'you':'')+'"><div class="av" aria-hidden="true">'+
      (who==='you'?'🧒':emoji)+'</div><div class="msg">'+esc(text)+'</div></div>';
  }

  function home(){
    var h='<div class="center"><h1 class="logo">TalkQuest</h1>'+
      '<p class="soft" style="max-width:22rem;margin:0 auto;font-size:15px;line-height:1.55">'+
      'Practice saying the hard thing. Pick a scenario, choose your words, and watch how the conversation turns.</p></div>'+
      '<div class="stack">';
    SCENARIOS.forEach(function(s){
      var stars=st.best[s.id];
      h+='<button class="scen" data-s="'+s.id+'"><span class="em" aria-hidden="true">'+s.emoji+'</span>'+
         '<span class="t"><b>'+esc(s.title)+'</b><span>Talking to '+esc(s.adult)+' · '+esc(s.goal)+'</span></span>'+
         (stars ? '<span style="font-size:17px">'+new Array(stars+1).join('⭐')+'</span>' : '<span class="play">Play</span>')+
         '</button>';
    });
    return h+'</div><p class="center soft" style="font-size:12px;margin:0">'+
      'Tip from the dojo: there\'s no "losing" a hard conversation — every replay teaches you a new path through it.</p>';
  }

  function intro(){
    var s=scen();
    return '<button class="back" data-home="1">← All scenarios</button>'+
      '<div class="card" style="box-shadow:4px 4px 0 var(--ink)">'+
        '<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">'+
          '<span style="font-size:29px" aria-hidden="true">'+s.emoji+'</span><h2>'+esc(s.title)+'</h2></div>'+
        '<p style="font-size:15px;margin:0;line-height:1.55">'+esc(s.setup)+'</p>'+
        '<p style="margin:14px 0 0;background:var(--paper);border:1.5px dashed var(--ink);border-radius:12px;'+
          'padding:9px 13px;font-size:14px;font-weight:700">🎯 Your goal: '+esc(s.goal)+'</p>'+
      '</div>'+
      '<button class="btn coral wide" data-play="1">Start the conversation</button>';
  }

  function play(){
    var s=scen(), turn=st.turns[st.ti];
    var h='<button class="back" data-home="1">← All scenarios</button>'+meter(s.adult,st.trust)+'<div class="stack">';
    var last=st.history[st.history.length-1];
    if(last) h+='<div class="stack" style="opacity:.55">'+bub('npc',s.emoji,last.npc)+bub('you','',last.you)+'</div>';
    h+=bub('npc',s.emoji,turn.npc);
    if(st.picked) h+=bub('you','',st.picked.text);
    h+='</div>';

    if(!st.picked){
      h+='<div class="stack"><div class="lbl">What do you say?</div>';
      turn.choices.forEach(function(c,i){ h+='<button class="choice" data-c="'+i+'">\u201C'+esc(c.text)+'\u201D</button>'; });
      h+='</div>';
    } else {
      var q=QS[st.picked.quality];
      h+='<div class="stack">'+
        '<div class="card" style="border-color:'+q.color+';box-shadow:3px 3px 0 '+q.color+'">'+
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">'+
            '<span style="font-size:14px;font-weight:800;color:'+q.color+'">'+q.icon+' '+q.tag+'</span>'+
            '<span style="font-size:12px;font-weight:700;color:'+(st.picked.delta>=0?'var(--mint)':'var(--rose)')+'">'+
              (st.picked.delta>=0?'+'+st.picked.delta:st.picked.delta)+' trust</span>'+
          '</div>'+
          '<p style="font-size:14px;margin:0;line-height:1.55">'+esc(st.picked.feedback)+'</p>'+
          '<p class="lbl" style="margin:9px 0 0">Skill: '+esc(st.picked.skill)+'</p>'+
        '</div>'+
        '<button class="btn dark" data-next="1">'+(st.ti+1<st.turns.length?'Continue →':'See how it went →')+'</button>'+
      '</div>';
    }
    return h;
  }

  function end(){
    var s=scen(), r=rating(st.trust,st.greats);
    var h='<div class="pop center" style="display:flex;flex-direction:column;align-items:center;gap:14px">'+
      '<div style="font-size:44px" aria-hidden="true">'+new Array(r.stars+1).join('⭐')+
        '<span style="opacity:.2">'+new Array(4-r.stars).join('⭐')+'</span></div>'+
      '<h2 style="font-size:25px">'+esc(r.title)+'</h2>'+
      '<p class="soft" style="max-width:22rem;font-size:15px;margin:0">'+esc(r.note)+'</p>'+
      meter(s.adult,st.trust);
    if(st.skills.length){
      h+='<div class="card" style="width:100%"><div class="lbl" style="margin-bottom:9px">Skills you used</div>'+
         '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px">';
      st.skills.forEach(function(k){ h+='<span class="tag">'+esc(k)+'</span>'; });
      h+='</div></div>';
    }
    return h+'<div style="display:flex;gap:12px">'+
      '<button class="btn coral" data-replay="1">Replay scenario</button>'+
      '<button class="btn plain" data-home="1">All scenarios</button>'+
    '</div></div>';
  }

  var SCREENS={ home:home, intro:intro, play:play, end:end };

  function start(id){
    st.sid=id; st.ti=0; st.trust=50; st.picked=null; st.history=[]; st.greats=0; st.skills=[];
    st.turns = scen().turns.map(function(t){ return { npc:t.npc, choices:shuffle(t.choices) }; });
    st.screen='intro'; render();
  }

  function render(){
    app.innerHTML = SCREENS[st.screen]();
    window.scrollTo(0,0);

    app.querySelectorAll('[data-s]').forEach(function(b){ b.onclick=function(){ start(b.getAttribute('data-s')); }; });
    app.querySelectorAll('[data-home]').forEach(function(b){ b.onclick=function(){ st.screen='home'; render(); }; });
    var p=app.querySelector('[data-play]'); if(p) p.onclick=function(){ st.screen='play'; render(); };
    app.querySelectorAll('[data-c]').forEach(function(b){
      b.onclick=function(){ choose(st.turns[st.ti].choices[parseInt(b.getAttribute('data-c'),10)]); };
    });
    var n=app.querySelector('[data-next]'); if(n) n.onclick=nextTurn;
    var r=app.querySelector('[data-replay]'); if(r) r.onclick=function(){ start(st.sid); };
  }

  function choose(c){
    st.trust=Math.max(0,Math.min(100,st.trust+c.delta));
    st.picked=c;
    if(c.quality===2){ st.greats++; if(st.skills.indexOf(c.skill)===-1) st.skills.push(c.skill); }
    render();
  }

  function nextTurn(){
    st.history.push({ npc:st.turns[st.ti].npc, you:st.picked.text });
    st.picked=null;
    if(st.ti+1 < st.turns.length){ st.ti++; render(); return; }
    var r=rating(st.trust,st.greats), prev=st.best[st.sid]||0, gained=Math.max(0,r.stars-prev);
    if(gained>0) awardSeeds(gained*15, "Did well in TalkQuest");
    else awardSeeds(2, "Practised a TalkQuest scenario");
    st.best[st.sid]=Math.max(prev,r.stars);
    st.screen='end'; render();
  }

  render();
})();
</script>
</body>
</html>
