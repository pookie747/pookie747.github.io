<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Money Quest 🍋 — Learn money skills, earn coins</title>
<meta name="description" content="A free money-smarts game for kids: earn coins, build streaks, and watch compound interest grow your jar." />
<script src="./seeds.js"></script>
<style>
  :root{
    --sky:#EAF4FE; --ink:#1E3A5F; --inkSoft:#5A7290;
    --sunny:#FFC83D; --sunnyDark:#E0A714; --berry:#FF6B6B;
    --leaf:#2FB873; --leafDark:#1F8A55; --card:#FFFFFF; --line:#D7E6F5;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--sky); color:var(--ink);
        font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif; }
  .display{ font-weight:800; letter-spacing:-0.01em; }

  #seeds-bar{ position:sticky; top:0; z-index:9999; display:flex; align-items:center;
        justify-content:space-between; padding:8px 14px; background:#FBF7EF; border-bottom:1px solid #E6E0D2; }
  #seeds-bar a, #seeds-bar .pill{ display:inline-flex; align-items:center; gap:7px; text-decoration:none;
        color:#2C4A52; font-weight:700; font-size:15px; background:#E4EFE3; border:1px solid #CFE3D0;
        padding:6px 14px; border-radius:999px; }

  .awning{ display:flex; width:100%; height:18px; overflow:hidden; }
  .awning i{ flex:1; margin-right:2px; border-bottom-left-radius:9px; border-bottom-right-radius:9px; }

  .topbar{ position:sticky; top:51px; z-index:20; background:var(--sky); }
  .topbar .row{ display:flex; align-items:center; justify-content:space-between; gap:10px;
        max-width:448px; margin:0 auto; padding:8px 16px; }
  .brand{ background:none; border:none; font-size:18px; font-weight:800; color:var(--ink);
        cursor:pointer; padding:0; font-family:inherit; }
  .stats{ display:flex; align-items:center; gap:12px; }
  .chip{ display:flex; align-items:center; gap:5px; padding:4px 12px; border-radius:999px;
        font-weight:800; font-size:15px; }
  .chip.coin{ background:#FFF3CF; border:2px solid var(--sunny); }
  .chip.streak{ background:#EEF4FB; border:2px solid var(--line); }
  .chip.streak.hot{ background:#FFE2E2; border-color:var(--berry); }

  .wrap{ max-width:448px; margin:0 auto; padding:24px 20px 64px; }
  .center{ text-align:center; }

  .btn{ width:100%; border:none; border-radius:16px; padding:16px; font-size:19px; font-weight:800;
        color:#fff; background:var(--leaf); box-shadow:0 4px 0 var(--leafDark); cursor:pointer;
        font-family:inherit; }
  .btn:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--leafDark); }
  .btn.gold{ background:var(--sunnyDark); box-shadow:0 4px 0 #A87C0A; }

  .card{ background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; }
  .card.pad{ padding:20px; }

  .lvl{ display:flex; align-items:center; gap:14px; width:100%; padding:16px; border-radius:18px;
        text-align:left; background:var(--card); border:2px solid var(--line); cursor:pointer;
        box-shadow:0 2px 0 var(--line); font-family:inherit; }
  .lvl[disabled]{ background:#F2F6FB; opacity:.55; box-shadow:none; cursor:default; }
  .lvl.done{ border-color:var(--leaf); }
  .lvl .em{ font-size:30px; }
  .lvl .t{ flex:1; }
  .lvl .t b{ display:block; font-size:16px; font-weight:800; color:var(--ink); }
  .lvl .t span{ font-size:14px; color:var(--inkSoft); }
  .lvl .badge{ font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px;
        background:#E2F7EC; color:var(--leafDark); }

  .opt{ width:100%; padding:16px; border-radius:16px; text-align:left; font-weight:700; font-size:15.5px;
        line-height:1.4; background:var(--card); border:2px solid var(--line); color:var(--ink);
        box-shadow:0 2px 0 var(--line); cursor:pointer; font-family:inherit; }
  .opt[disabled]{ box-shadow:none; cursor:default; }
  .opt.right{ background:#E2F7EC; border-color:var(--leaf); color:var(--leafDark); }
  .opt.wrong{ background:#FFE9E9; border-color:var(--berry); color:#B43B3B; }

  .stack{ display:flex; flex-direction:column; gap:12px; }
  .bars{ display:flex; gap:4px; }
  .bars i{ flex:1; height:6px; border-radius:999px; background:var(--line); }
  .bars i.on{ background:var(--sunny); }

  h1{ font-size:38px; margin:0 0 8px; font-weight:800; }
  h2{ font-size:26px; margin:0 0 8px; font-weight:800; }
  p{ line-height:1.55; }
  .soft{ color:var(--inkSoft); }

  @keyframes pop{ 0%{ transform:scale(.7); opacity:0; } 70%{ transform:scale(1.06); } 100%{ transform:scale(1); opacity:1; } }
  @keyframes wiggle{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-5deg); } 75%{ transform:rotate(5deg); } }
  @keyframes sparkle{ 0%,100%{ opacity:.35; transform:scale(.92); } 50%{ opacity:1; transform:scale(1.14); } }
  @keyframes floatup{ 0%{ transform:translateY(0); opacity:1; } 100%{ transform:translateY(-34px); opacity:0; } }
  .pop{ animation:pop .34s ease-out both; }
  .wiggle{ animation:wiggle .6s ease-in-out; display:inline-block; }
  .sparkle{ animation:sparkle 1.4s ease-in-out infinite; }
  .burst{ position:absolute; top:-4px; right:0; font-size:14px; font-weight:800; color:var(--leafDark);
        animation:floatup .9s ease-out both; }
  .jarfill{ transition:height .8s cubic-bezier(.22,1,.36,1); }
  @media (prefers-reduced-motion: reduce){
    .pop,.wiggle,.sparkle,.burst{ animation:none !important; }
    .jarfill{ transition:none !important; }
  }
</style>
</head>
<body>
  <div id="seeds-bar">
    <a href="index.html">🏡 Home</a>
    <span class="pill">🌱 <span id="seeds-num">0</span> seeds</span>
  </div>

  <div class="topbar">
    <div class="awning" id="awning" aria-hidden="true"></div>
    <div class="row">
      <button class="brand" id="brandBtn">🍋 Money Quest</button>
      <div class="stats">
        <div class="chip coin" style="position:relative">🪙 <span id="coinNum">0</span><span id="burstSlot"></span></div>
        <div class="chip streak" id="streakChip">🔥 <span id="streakNum">0</span></div>
      </div>
    </div>
  </div>

  <div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  // ---------- seeds plumbing ----------
  function awardSeeds(n, why){ try{ if(window.Seeds){ window.Seeds.award(n, why); toast(n); } }catch(e){} }
  function updateBar(){ var el=document.getElementById('seeds-num');
    if(el){ try{ el.textContent = (window.Seeds ? window.Seeds.get() : 0); }catch(e){} } }
  function toast(n){
    var t=document.getElementById('seed-toast');
    if(!t){ t=document.createElement('div'); t.id='seed-toast';
      t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:#1E3A5F;color:#fff;font-family:inherit;font-weight:800;padding:13px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .4s cubic-bezier(.22,1,.36,1);z-index:10000;font-size:16px;";
      document.body.appendChild(t); }
    t.textContent="🌱 +"+n+" seeds!";
    requestAnimationFrame(function(){ t.style.transform="translateX(-50%) translateY(0)"; });
    clearTimeout(t._h); t._h=setTimeout(function(){ t.style.transform="translateX(-50%) translateY(120px)"; },2200);
    updateBar();
  }
  updateBar();
  if(window.Seeds && window.Seeds.onChange) window.Seeds.onChange(updateBar);

  // ---------- awning stripes ----------
  var aw=document.getElementById('awning'), s='';
  for(var i=0;i<12;i++){ s+='<i style="background:'+(i%2===0?'#FF6B6B':'#FFF6F6')+'"></i>'; }
  aw.innerHTML=s;

  // ---------- content ----------
  var COIN_CORRECT=10, COIN_LEARN=3, STREAK_BONUS=5, JAR_MAX=420;

  var LEVELS=[
    { title:"Earning Money", emoji:"🍋", tag:"Where money comes from", badge:"Lemonade Boss",
      lesson:["Money doesn't grow on trees — people earn it by doing something valuable for someone else. That could be a job, chores, babysitting, or selling lemonade.",
              "The more useful your skills are, the more you can earn. That's why learning new things is one of the best money moves you can ever make."],
      questions:[
        { q:"You really want a game that costs $60. What's the smartest FIRST step?",
          options:["Ask your parents every day until they give in","Find ways to earn it — chores, a lemonade stand, helping neighbors","Borrow it from a friend and worry later","Wait for it to magically appear"],
          correct:1, explain:"Earning it yourself means nobody can take it back, and you'll value the game more. Plus you just learned how to make money!" },
        { q:"Maya walks dogs for $10 per dog. She walks 3 dogs every Saturday. How much after 2 Saturdays?",
          options:["$30","$50","$60","$80"], correct:2,
          explain:"3 dogs × $10 = $30 each Saturday. Two Saturdays = $60. Small jobs add up fast when you keep showing up!" },
        { q:"Which of these grows your earning power the MOST over time?",
          options:["Buying lottery tickets","Learning new skills","Complaining about prices","Hiding money under your bed"],
          correct:1, explain:"Skills are like a money machine you carry in your brain. The more you can do, the more people will pay you to do it." }
      ] },
    { title:"Needs vs Wants", emoji:"🎯", tag:"Spending with a brain", badge:"Smart Shopper",
      lesson:["A NEED is something you must have to live and be okay: food, water, a safe home, school supplies.",
              "A WANT is something fun or nice to have: game skins, candy, the newest sneakers. Wants aren't bad — but needs always come first."],
      questions:[
        { q:"Which one of these is a NEED?", options:["A rare game skin","Concert tickets","Food for the week","The newest phone"],
          correct:2, explain:"You literally can't function without food. Everything else on that list is a want — fun, but optional." },
        { q:"You have $20. School lunches this week cost $15. A sticker pack costs $8. What do you do?",
          options:["Buy the stickers — they're limited edition!","Cover lunch first, then see what's left","Skip lunch two days to afford both","Spend it all and figure it out later"],
          correct:1, explain:"Needs first, always. After lunch is covered you have $5 left — not enough for stickers yet, but you didn't go hungry. That's a win." },
        { q:"Are wants bad?", options:["Yes, never buy anything fun","No — wants are fine AFTER needs are covered and some money is saved","Yes, fun is a scam","Only on weekends"],
          correct:1, explain:"Money is also for enjoying life! The trick is the order: needs → savings → wants. Get the order right and you can have fun guilt-free." }
      ] },
    { title:"Budgeting", emoji:"🗺️", tag:"A plan for every dollar", badge:"Budget Captain",
      lesson:["A budget is just a plan that tells your money where to go — instead of wondering where it went.",
              "An easy starter plan is Save–Spend–Share: put some away for later, keep some for now, and set a little aside to help others."],
      questions:[
        { q:"You get $40 for your birthday. Which plan follows Save–Spend–Share?",
          options:["$40 on candy, day one","$15 saved, $20 to spend, $5 to share or donate","$40 hidden forever, never touched","$40 loaned to your cousin at 50% interest"],
          correct:1, explain:"That split covers the future (save), the fun (spend), and kindness (share). The exact numbers can change — having a plan is what matters." },
        { q:"What IS a budget, really?", options:["A punishment for liking nice things","A plan for your money","Something only adults with boring jobs need","An app that yells at you"],
          correct:1, explain:"That's it. A plan. People with budgets aren't less fun — they just know exactly how much fun they can afford." },
        { q:"Oops — you spent your whole week's snack money in two days. Best move?",
          options:["Give up, budgets don't work","Borrow snack money and repeat next week","Track what happened and adjust next week's plan","Blame the vending machine"],
          correct:2, explain:"Budgets aren't about being perfect — they're about noticing and adjusting. Every pro budgeter has blown a budget. They just tried again." }
      ] },
    { title:"Compound Interest", emoji:"🌱", tag:"Money that grows money", badge:"Interest Wizard",
      lesson:["When you save money in a bank, the bank pays YOU a little extra called interest. It's like your money planted seeds.",
              "Compound interest is the magic part: next year you earn interest on your interest. Start early and small amounts become huge — time is your superpower."],
      questions:[
        { q:"You save $100 at 10% interest per year. How much after 1 year?", options:["$100","$101","$110","$200"],
          correct:2, explain:"10% of $100 is $10, so you'd have $110 — and you didn't have to do anything. Your money worked while you slept." },
        { q:"Year 2: your $110 earns 10% again. Why do you earn MORE than $10 this time?",
          options:["The bank made a mistake","You earn interest on your interest — that's compounding","Inflation","You don't — it's always exactly $10"],
          correct:1, explain:"10% of $110 is $11. The $10 you earned last year is now earning its own money. That snowball gets bigger every single year." },
        { q:"Who likely ends up with MORE money at 65?",
          options:["Sam: saves $50/month starting at 16","Alex: saves $200/month starting at 40","Neither, saving is pointless","Whoever finds money on the ground"],
          correct:0, explain:"Sam wins in most scenarios! Starting 24 years earlier gives compounding way more time to snowball. When you're young, TIME beats AMOUNT." }
      ] },
    { title:"Credit & Debt", emoji:"🧾", tag:"Borrowed money bites back", badge:"Debt Dodger",
      lesson:["Credit means borrowing money you promise to pay back — usually with interest added on top. This time, interest works AGAINST you.",
              "Debt isn't always evil (borrowing for education or a home can make sense), but borrowing for snacks and skins is how people get stuck."],
      questions:[
        { q:"What is a credit card, really?", options:["Free money from the bank","A loan you must pay back, often with interest","A magic rectangle","A gift card that refills itself"],
          correct:1, explain:"Every swipe is a mini-loan. Pay it back fast and it's a handy tool. Pay it back slowly and the interest piles up against you." },
        { q:"If you only pay the tiny 'minimum payment' on credit card debt, what happens?",
          options:["The debt disappears eventually, no big deal","Interest keeps growing the debt — you can owe way more than you spent","The bank thanks you and lowers the price","Nothing, minimums are a cheat code"],
          correct:1, explain:"Minimum payments mostly cover interest, barely touching what you owe. A $500 TV can quietly become $900+. Banks love minimum payers." },
        { q:"Which is the most sensible reason to borrow money?",
          options:["Daily bubble tea","Education or training that raises what you can earn","A cooler phone than your friend's","In-game currency"],
          correct:1, explain:"Good debt buys things that grow in value or grow YOU. Bad debt buys things that are gone by Tuesday." }
      ] },
    { title:"Scam Defense", emoji:"🛡️", tag:"Protect your coins", badge:"Scam Slayer",
      lesson:["Scammers love targeting young people online — fake giveaways, 'free' gift cards, messages pretending to be friends or famous people.",
              "Golden rules: if it sounds too good to be true, it is. Never share passwords or PINs. Real prizes never ask YOU to pay first."],
      questions:[
        { q:"A DM says: 'Send a $50 gift card and we'll send back $500!' What is this?",
          options:["An amazing investment","A scam — real money doesn't multiply by magic","A bank promotion","Worth trying once with small money"],
          correct:1, explain:"100% scam. The moment you send the card, they vanish. Nobody hands strangers free money — that's the oldest trick on the internet." },
        { q:"Which of these should you NEVER share, even with someone claiming to be your bank?",
          options:["Your favorite color","Your passwords and PIN codes","Your opinion on pineapple pizza","Your high score"],
          correct:1, explain:"Real banks never ask for your password or PIN. Anyone who does is a scammer — hang up, block, and tell a trusted adult." },
        { q:"An online 'friend' you've never met says they have a guaranteed way to double your money fast. You should…",
          options:["Send a little to test it","Be suspicious — 'guaranteed' + 'fast' = classic scam recipe","Send everything for maximum profit","Ask them to double it twice"],
          correct:1, explain:"No real investment is guaranteed AND fast. That combo is scammer perfume. Trust your gut and talk to an adult you trust." }
      ] }
  ];

  // ---------- state ----------
  var st = { screen:"home", coins:0, streak:0, best:0, done:[], li:0, qi:0, picked:null, levelCoins:0, interest:0 };
  var app = document.getElementById('app');

  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function lvl(){ return LEVELS[st.li]; }
  function allDone(){ return st.done.length === LEVELS.length; }

  function syncStats(){
    document.getElementById('coinNum').textContent = st.coins;
    document.getElementById('streakNum').textContent = st.streak;
    document.getElementById('streakChip').className = 'chip streak' + (st.streak>=3 ? ' hot' : '');
  }
  function addCoins(n){
    st.coins += n; st.levelCoins += n; syncStats();
    var slot=document.getElementById('burstSlot');
    slot.innerHTML='<span class="burst">+'+n+' 🪙</span>';
    setTimeout(function(){ slot.innerHTML=''; }, 950);
  }

  function jar(coins){
    var pct=Math.min(coins/JAR_MAX,1), h=8+pct*50, y=66-h;
    return '<svg width="56" height="70" viewBox="0 0 56 70" role="img" aria-label="Coin jar, '+coins+' coins">'+
      '<rect x="14" y="2" width="28" height="7" rx="2.5" fill="#5A7290"/>'+
      '<path d="M10 12 h36 v44 a12 12 0 0 1 -12 12 h-12 a12 12 0 0 1 -12 -12 z" fill="#fff" stroke="#D7E6F5" stroke-width="2"/>'+
      '<clipPath id="jc"><path d="M12 13 h32 v42 a11 11 0 0 1 -11 11 h-10 a11 11 0 0 1 -11 -11 z"/></clipPath>'+
      '<g clip-path="url(#jc)">'+
        '<rect class="jarfill" x="10" y="'+y+'" width="36" height="'+h+'" fill="#FFC83D"/>'+
        '<circle cx="22" cy="'+(64-h)+'" r="4" fill="#E0A714" opacity="'+(pct>0.05?1:0)+'"/>'+
        '<circle cx="34" cy="'+(66-h)+'" r="4" fill="#E0A714" opacity="'+(pct>0.12?1:0)+'"/>'+
      '</g></svg>';
  }

  // ---------- screens ----------
  function home(){
    return '<div class="pop center">'+
      '<div style="font-size:60px;margin-bottom:10px" class="wiggle">🍋</div>'+
      '<h1>Money Quest</h1>'+
      '<p class="soft" style="font-weight:800;margin:0 0 4px">Run your own lemonade-stand fortune.</p>'+
      '<p class="soft" style="font-size:15px;margin:0 0 26px">Answer money challenges, earn coins, and watch your jar grow interest — for real, inside the game.</p>'+
      '<div class="card pad" style="text-align:left;margin-bottom:26px">'+
        '<p class="display" style="margin:0 0 8px">How it works</p>'+
        '<p class="soft" style="font-size:14.5px;margin:0 0 5px">🪙 Correct answers earn 10 coins. Wrong ones still earn 3 — learning pays.</p>'+
        '<p class="soft" style="font-size:14.5px;margin:0 0 5px">🔥 A 3+ streak adds bonus coins.</p>'+
        '<p class="soft" style="font-size:14.5px;margin:0">🌱 Finish a level and your whole jar earns 10% interest. That\'s compounding!</p>'+
      '</div>'+
      '<button class="btn" data-go="map">Start the Quest</button>'+
    '</div>';
  }

  function map(){
    var h='<div class="pop">'+
      '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px">'+
        '<div><h2>Your Quest Map</h2><p class="soft" style="margin:0;font-size:14.5px">'+st.done.length+' of '+LEVELS.length+' levels complete</p></div>'+
        jar(st.coins)+
      '</div>';
    if(allDone()) h+='<button class="btn gold" style="margin-bottom:16px" data-go="done">🏆 See your final results</button>';
    h+='<div class="stack">';
    LEVELS.forEach(function(lv,i){
      var isDone = st.done.indexOf(i)>-1;
      var locked = i>0 && st.done.indexOf(i-1)===-1;
      h+='<button class="lvl'+(isDone?' done':'')+'" '+(locked?'disabled':'data-lvl="'+i+'"')+'>'+
           '<span class="em">'+(locked?'🔒':lv.emoji)+'</span>'+
           '<span class="t"><b>Level '+(i+1)+': '+esc(lv.title)+'</b><span>'+esc(lv.tag)+'</span></span>'+
           (isDone?'<span class="badge">✓ '+esc(lv.badge)+'</span>':'')+
         '</button>';
    });
    return h+'</div></div>';
  }

  function lesson(){
    var lv=lvl(), h='<div class="pop">'+
      '<p class="soft" style="font-weight:800;font-size:14px;margin:0 0 4px">Level '+(st.li+1)+'</p>'+
      '<h2 style="font-size:29px;margin-bottom:16px">'+lv.emoji+' '+esc(lv.title)+'</h2>'+
      '<div class="card pad" style="margin-bottom:24px">';
    lv.lesson.forEach(function(p,i){
      h+='<p style="font-weight:700;font-size:15.5px;margin:0'+(i<lv.lesson.length-1?' 0 14px':'')+'">'+esc(p)+'</p>';
    });
    return h+'</div><button class="btn" data-go="quiz">I\'m ready — quiz me!</button></div>';
  }

  function quiz(){
    var lv=lvl(), q=lv.questions[st.qi], answered=st.picked!==null, right=answered&&st.picked===q.correct;
    var h='<div class="pop">'+
      '<p class="soft" style="font-weight:800;font-size:14px;margin:0 0 12px">'+lv.emoji+' '+esc(lv.title)+' · Question '+(st.qi+1)+'/'+lv.questions.length+'</p>'+
      '<div class="bars" style="margin-bottom:20px">';
    lv.questions.forEach(function(_,i){ h+='<i class="'+(i<=st.qi?'on':'')+'"></i>'; });
    h+='</div><h2 style="font-size:21px;line-height:1.35;margin-bottom:20px">'+esc(q.q)+'</h2><div class="stack" style="margin-bottom:20px">';
    q.options.forEach(function(o,i){
      var cls='opt';
      if(answered && i===q.correct) cls+=' right';
      else if(answered && i===st.picked && !right) cls+=' wrong';
      h+='<button class="'+cls+'" '+(answered?'disabled':'data-opt="'+i+'"')+'>'+esc(o)+'</button>';
    });
    h+='</div>';
    if(answered){
      var head = right ? (st.streak>=3 ? 'Correct! 🔥 Streak bonus! +'+(COIN_CORRECT+STREAK_BONUS)+' coins' : 'Correct! +'+COIN_CORRECT+' coins')
                       : 'Not quite — but +'+COIN_LEARN+' coins for learning';
      h+='<div class="card pop" style="margin-bottom:20px;background:'+(right?'#E2F7EC':'#FFF3CF')+';border-color:'+(right?'var(--leaf)':'var(--sunny)')+'">'+
           '<p class="display" style="margin:0 0 6px">'+head+'</p>'+
           '<p class="soft" style="font-weight:700;font-size:14.5px;margin:0">'+esc(q.explain)+'</p>'+
         '</div>'+
         '<button class="btn" data-next="1">'+(st.qi+1<lv.questions.length?'Next question':'Finish level')+'</button>';
    }
    return h+'</div>';
  }

  function interest(){
    var lv=lvl();
    return '<div class="pop center">'+
      '<div class="sparkle" style="font-size:46px;margin-bottom:6px">✨</div>'+
      '<h2 style="font-size:29px">Interest Day!</h2>'+
      '<p class="soft" style="font-weight:800;margin:0 0 22px">Level complete! While you played, your jar earned <span style="color:var(--leafDark)">10% interest</span>.</p>'+
      '<div style="display:flex;justify-content:center;margin-bottom:16px">'+jar(st.coins)+'</div>'+
      '<div class="card pad" style="border-color:var(--leaf);margin-bottom:12px">'+
        '<p class="display" style="font-size:17px;margin:0 0 4px">Quiz coins: +'+st.levelCoins+' 🪙</p>'+
        '<p class="display" style="font-size:17px;color:var(--leafDark);margin:0">Interest: +'+st.interest+' 🪙 — earned by doing nothing!</p>'+
        '<p class="soft" style="font-weight:700;font-size:14.5px;margin:10px 0 0">That\'s compound interest. The bigger your jar gets, the bigger every Interest Day becomes. This is exactly how real savings work.</p>'+
      '</div>'+
      '<p class="soft" style="font-weight:800;font-size:14.5px;margin:0 0 22px">🏅 Badge earned: '+esc(lv.badge)+'</p>'+
      '<button class="btn" data-go="'+(allDone()?'done':'map')+'">'+(allDone()?'See final results':'Back to the map')+'</button>'+
    '</div>';
  }

  function doneScreen(){
    var h='<div class="pop center">'+
      '<div style="font-size:58px;margin-bottom:8px">🏆</div>'+
      '<h2 style="font-size:29px">Quest Complete!</h2>'+
      '<p class="soft" style="font-weight:800;margin:0 0 22px">You\'re officially money-smarter than most adults. Seriously.</p>'+
      '<div class="card pad" style="text-align:left;border-color:var(--sunny);margin-bottom:16px">'+
        '<p class="display" style="margin:0 0 8px">Final jar: '+st.coins+' 🪙 · Best streak: '+st.best+' 🔥</p>';
    LEVELS.forEach(function(lv){
      h+='<p class="soft" style="font-weight:700;font-size:14.5px;margin:0 0 4px">'+lv.emoji+' '+esc(lv.title)+' → 🏅 '+esc(lv.badge)+'</p>';
    });
    return h+'</div>'+
      '<div class="card pad" style="text-align:left;background:#E2F7EC;border-color:var(--leaf);margin-bottom:24px">'+
        '<p class="display" style="color:var(--leafDark);margin:0 0 8px">Take this with you:</p>'+
        '<p style="font-weight:700;font-size:14.5px;margin:0;line-height:1.6">Earn with your skills. Needs before wants. Give every dollar a plan. Start saving early — time is your superpower. Borrow carefully. And if it sounds too good to be true… it is. 🛡️</p>'+
      '</div>'+
      '<button class="btn" data-reset="1">Play again</button>'+
    '</div>';
  }

  // ---------- render + events ----------
  var SCREENS = { home:home, map:map, lesson:lesson, quiz:quiz, interest:interest, done:doneScreen };

  function render(){
    app.innerHTML = SCREENS[st.screen]();
    syncStats();
    window.scrollTo(0,0);

    app.querySelectorAll('[data-go]').forEach(function(b){
      b.onclick=function(){ st.screen=b.getAttribute('data-go'); render(); };
    });
    app.querySelectorAll('[data-lvl]').forEach(function(b){
      b.onclick=function(){
        st.li=parseInt(b.getAttribute('data-lvl'),10);
        st.qi=0; st.picked=null; st.levelCoins=0; st.screen='lesson'; render();
      };
    });
    app.querySelectorAll('[data-opt]').forEach(function(b){
      b.onclick=function(){ pick(parseInt(b.getAttribute('data-opt'),10)); };
    });
    var nx=app.querySelector('[data-next]'); if(nx) nx.onclick=next;
    var rs=app.querySelector('[data-reset]'); if(rs) rs.onclick=function(){
      st={ screen:"home", coins:0, streak:0, best:0, done:[], li:0, qi:0, picked:null, levelCoins:0, interest:0 };
      render();
    };
  }

  function pick(i){
    if(st.picked!==null) return;
    st.picked=i;
    var q=lvl().questions[st.qi];
    if(i===q.correct){
      var bonus = (st.streak+1)>=3 ? STREAK_BONUS : 0;
      addCoins(COIN_CORRECT+bonus);
      st.streak++; st.best=Math.max(st.best,st.streak);
    } else {
      addCoins(COIN_LEARN); st.streak=0;
    }
    render();
  }

  function next(){
    var lv=lvl();
    if(st.qi+1 < lv.questions.length){ st.qi++; st.picked=null; render(); return; }
    st.interest = Math.max(1, Math.round(st.coins*0.1));
    st.coins += st.interest; syncStats();
    var firstTime = st.done.indexOf(st.li)===-1;
    if(firstTime){
      st.done.push(st.li);
      awardSeeds(10 + Math.round(st.levelCoins/5), "Finished a Money Quest level");
      if(st.done.length===LEVELS.length) awardSeeds(50, "Completed all of Money Quest!");
    } else {
      awardSeeds(2, "Practised a Money Quest level");
    }
    st.screen='interest'; render();
  }

  document.getElementById('brandBtn').onclick=function(){
    st.screen = (st.screen==='home') ? 'home' : 'map'; render();
  };

  render();
})();
</script>
</body>
</html>
